name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: jaist-vpn-auth
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: signalridge/jaist-sso
          ref: 657802eeb3085f4334aca4d18356a7bcbd56f428
          path: jaist-sso
          token: ${{ secrets.SSO_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: jaist-sso
      - run: bun install --frozen-lockfile
        working-directory: jaist-vpn-auth
      - run: bun run check
        working-directory: jaist-vpn-auth
      - run: bun pm pack --dry-run
        working-directory: jaist-vpn-auth
